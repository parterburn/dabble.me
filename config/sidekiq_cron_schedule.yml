# Sidekiq-Cron schedules (loaded when Sidekiq starts). All times are UTC unless a
# timezone suffix is added to the cron field (see https://github.com/sidekiq-cron/sidekiq-cron).

# CRON FORMAT:
# minute hour day-of-month month day-of-week

send_hourly_entries:
  cron: "0 * * * *"
  class: "SendHourlyEntriesWorker"
  description: "Hourly at :00"

user_downgrade_expired:
  cron: "30 0 * * *"
  class: "UserDowngradeExpiredWorker"
  description: "Daily at 12:30 AM UTC"

entry_maintenance:
  cron: "0 15 * * 3"
  class: "EntryMaintenanceWorker"
  description: "Weekly on Wednesday at 3:00 PM UTC"

export_cleanup:
  cron: "20 4 * * *"
  class: "ExportCleanupWorker"
  description: "Daily at 4:20 AM UTC. Deletes the files of exports past their 7 days."

capture_business_metrics:
  cron: "5 0 * * *"
  class: "CaptureBusinessMetricsWorker"
  description: "Daily at 12:05 AM UTC, before expired-plan downgrades at 12:30 AM. Snapshots yesterday's founder metrics."

founder_weekly_digest:
  cron: "0 6 * * 1"
  class: "FounderWeeklyDigestWorker"
  description: "Mondays at 6:00 AM UTC. Emails the weekly founder digest."

oauth_app_cleanup:
  cron: "0 4 * * 0"
  class: "OauthAppCleanupWorker"
  description: "Sundays at 4:00 AM UTC. Deletes self-registered OAuth clients unused for 30 days."

apple_subscription_refresh:
  cron: "45 0 * * *"
  class: "AppleSubscriptionRefreshWorker"
  description: "Daily at 12:45 AM UTC. Re-reads App Store subscriptions from Apple in case a notification was missed, and ends PRO whose paid period is over."

email_code_cleanup:
  cron: "40 4 * * *"
  class: "EmailCodeCleanupWorker"
  description: "Daily at 4:40 AM UTC. Deletes emailed sign-in codes older than two days."

user_session_cleanup:
  cron: "50 4 * * *"
  class: "UserSessionCleanupWorker"
  description: "Daily at 4:50 AM UTC. Deletes Sessions-list rows that can no longer sign in (UserSession)."
