<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../Header and Search Results/source/common.css">
<style>
/* One captioned App Store frame. Sized by render.mjs: --w/--h are the screenshot's pixels. */
body { width: var(--w); height: var(--h); position: relative;
  background: linear-gradient(180deg, #f7f5f0 0%, #f2f0e9 55%, #e9e6dc 100%); }
.copy { position: absolute; left: 0; right: 0; top: calc(var(--h) * .052); text-align: center; padding: 0 6%; }
h1 { font-size: calc(var(--w) * var(--fs)); line-height: 1.02; color: var(--ink); letter-spacing: -.005em; }
h1 em { color: var(--olive); font-style: italic; }
.phone { left: 50%; transform: translateX(-50%); top: calc(var(--h) * var(--top)); width: calc(var(--w) * var(--pw));
  padding: calc(var(--w) * var(--pw) * .024); }
body.ipad .phone { border-radius: 4.2% / 3.2%; }
body.ipad .phone img { border-radius: 2.6% / 2%; }
</style></head><body>
<div class="copy"><h1 class="serif" id="t"></h1></div>
<div class="phone"><img id="s"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('t').innerHTML = q.get('t');
document.getElementById('s').src = q.get('s');
// kind: iphone, ipad, duo (open, landscape), duo-closed. Older calls pass ipad=1.
const kind = q.get('kind') || (q.get('ipad') === '1' ? 'ipad' : 'iphone');
if (kind === 'ipad') document.body.classList.add('ipad');
const w = +q.get('w'), h = +q.get('h');
const r = document.documentElement.style;
r.setProperty('--w', w + 'px'); r.setProperty('--h', h + 'px');
const [fs, pw, top_] = { iphone: [.1, .84, .215], ipad: [.062, .80, .205],
  duo: [.046, .78, .17], 'duo-closed': [.084, .80, .205] }[kind];
r.setProperty('--fs', fs); r.setProperty('--pw', pw); r.setProperty('--top', top_);
if (kind.startsWith('duo')) {
  // The Duo's wide frames: round the corners by a fixed size, not a share of each side.
  if (kind === 'duo') document.getElementById('t').innerHTML = q.get('t').replace(/<br>/g, ' ');
  const outer = w * pw, pad = outer * .024, radius = outer * (kind === 'duo' ? .045 : .075);
  document.querySelector('.phone').style.borderRadius = radius + 'px';
  document.getElementById('s').style.borderRadius = (radius - pad) + 'px';
}
</script>
</body></html>
