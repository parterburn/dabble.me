<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body { width: 3840px; height: 1646px; background: linear-gradient(100deg, #f7f5f0 0%, #f2f0e9 55%, #ebe8df 100%); position: relative; }
.copy { position: absolute; left: 260px; top: 0; height: 1646px; width: 1560px; display: flex; flex-direction: column; justify-content: center; }
.wordmark { font-size: 120px; color: var(--ink); }
.wordmark .dot { color: var(--olive); }
h1 { font-size: 210px; line-height: 1.08; color: var(--ink); margin-top: 70px; }
h1 em { color: var(--olive); font-style: italic; }
p { font-size: 66px; line-height: 1.4; color: #4a4a42; margin-top: 70px; }
.stage { position: absolute; right: 120px; top: 0; width: 1900px; height: 1646px; perspective: 5200px; }
.phone.left  { width: 600px; left: 40px;  top: 330px; transform: rotateY(28deg) rotateZ(-4deg); }
.phone.right { width: 600px; right: 40px; top: 330px; transform: rotateY(-28deg) rotateZ(4deg); }
.phone.center{ width: 690px; left: 605px; top: 165px; z-index: 2; }
</style></head><body>
<div class="copy">
  <div class="wordmark serif">Dabble me<span class="dot">.</span></div>
  <h1 class="serif">Your life, written down <em>and remembered.</em></h1>
  <p class="sans">A private journal with years of memories, On&nbsp;This&nbsp;Day, and photos.</p>
</div>
<div class="stage">
  <div class="phone left"><img src="ENTRY"></div>
  <div class="phone right"><img src="JOURNAL"></div>
  <div class="phone center"><img src="TODAY"></div>
</div>
</body></html>
