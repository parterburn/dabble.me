<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* iPhone shows about the middle 3100px of the width, with its back and share buttons over the
   top corners: the words sit in the centre, and the outer phones can be cut away. */
body { width: 3840px; height: 1646px; background: linear-gradient(180deg, #f7f5f0 0%, #f2f0e9 60%, #ebe8df 100%); position: relative; }
.copy { position: absolute; left: 1170px; top: 0; width: 1500px; height: 1646px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.wordmark { font-size: 104px; color: var(--ink); }
.wordmark .dot { color: var(--olive); }
h1 { font-size: 204px; line-height: 1.04; color: var(--ink); margin-top: 64px; }
h1 em { color: var(--olive); font-style: italic; }
p { font-size: 62px; line-height: 1.4; color: #4a4a42; margin-top: 72px; max-width: 1080px; }
.stage { position: absolute; left: 0; top: 0; width: 3840px; height: 1646px; perspective: 5200px; }
/* (The bezel in px: a percentage would be of the whole stage's width here.) */
.phone.inner { width: 700px; top: 220px; padding: 52px; z-index: 2; }
.phone.outer { width: 580px; top: 400px; padding: 44px; }
.phone.inner.left  { left: 410px;  transform: rotateY(18deg) rotateZ(-3deg); }
.phone.inner.right { right: 410px; transform: rotateY(-18deg) rotateZ(3deg); }
.phone.outer.left  { left: 30px;   transform: rotateY(26deg) rotateZ(-6deg); }
.phone.outer.right { right: 30px;  transform: rotateY(-26deg) rotateZ(6deg); }
</style></head><body>
<div class="stage">
  <div class="phone outer left"><img src="PHOTOS"></div>
  <div class="phone outer right"><img src="STATS"></div>
  <div class="phone inner left"><img src="TODAY"></div>
  <div class="phone inner right"><img src="JOURNAL"></div>
</div>
<div class="copy">
  <div class="wordmark serif">Dabble me<span class="dot">.</span></div>
  <h1 class="serif">Your life,<br>written down<br><em>and remembered.</em></h1>
  <p class="sans">Write a few lines today. See them again on this day, every year.</p>
</div>
</body></html>
